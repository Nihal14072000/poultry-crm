<main class="login-page">
  <section class="login-card">
    <a class="brand" href="/" aria-label="Flockwise home"><span class="brand-mark"><i></i><i></i><i></i></span><span>flockwise<small>OPERATIONS</small></span></a>
    <div class="eyebrow">POULTRY OPERATIONS WORKSPACE</div>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to continue to your organization.</p>
    <form (ngSubmit)="signIn()">
      <label>Username
        <input type="text" name="username" [(ngModel)]="username" autocomplete="username" required placeholder="Enter username">
      </label>
      <label>Password
        <input type="password" name="password" [(ngModel)]="password" autocomplete="current-password" required placeholder="Enter password">
      </label>
      @if (error) { <p class="error" role="alert">{{ error }}</p> }
      <button type="submit" [disabled]="loading || !username || !password">{{ loading ? 'Signing in…' : 'Sign in' }} <span>→</span></button>
    </form>
    <p class="security-note">Credentials remain in memory and are cleared when you reload or sign out. Use HTTPS outside local development.</p>
  </section>
</main>
